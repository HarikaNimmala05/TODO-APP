<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive To-Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>📝 My Tasks</h1>
            <p class="subtitle">Master your productivity</p>
        </header>

        <!-- Input Section -->
        <div class="input-section">
            <div class="input-wrapper">
                <input 
                    type="text" 
                    id="todoInput" 
                    class="todo-input" 
                    placeholder="Add a new task..."
                    autocomplete="off"
                >
                <button id="addBtn" class="add-btn">Add Task</button>
            </div>
        </div>

        <!-- Filter Section -->
        <div class="filter-section">
            <button class="filter-btn active" data-filter="all">
                All <span class="filter-count">(0)</span>
            </button>
            <button class="filter-btn" data-filter="active">
                Active <span class="filter-count">(0)</span>
            </button>
            <button class="filter-btn" data-filter="completed">
                Completed <span class="filter-count">(0)</span>
            </button>
        </div>

        <!-- Stats Section -->
        <div class="stats-section">
            <div class="stat">
                <span class="stat-label">Total Tasks:</span>
                <span class="stat-value" id="totalTasks">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">Completed:</span>
                <span class="stat-value" id="completedTasks">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">Progress:</span>
                <span class="stat-value" id="progressPercent">0%</span>
            </div>
        </div>

        <!-- Tasks List -->
        <div class="todos-container">
            <ul id="todoList" class="todo-list">
                <!-- Tasks will be dynamically added here -->
            </ul>
            <div id="emptyState" class="empty-state">
                <p>✨ No tasks yet. Add one to get started!</p>
            </div>
        </div>

        <!-- Clear Completed Button -->
        <div class="action-section">
            <button id="clearBtn" class="clear-btn">Clear Completed Tasks</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
